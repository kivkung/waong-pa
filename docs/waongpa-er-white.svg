<text x="60" y="2220" font-family="Tahoma, sans-serif" font-size="20" fill="#000000">เวลาไม่ว่างของรอบเป็นข้อมูลสำเนา จึงไม่มี FK ไปยังกิจกรรมส่วนตัว • available_member_ids เป็น JSON ไม่ใช่ FK</text>
