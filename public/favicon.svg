<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Waong-pa green chair mascot" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="128" height="128" rx="28" fill="#1b6b4f"/>
  <!-- floor shadow -->
  <ellipse cx="64" cy="111" rx="34" ry="4.5" fill="#0f3f2e" opacity=".55"/>
  <!-- chrome legs and crossbar -->
  <g stroke="#e9f1ec" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M40 84 L36 108"/>
    <path d="M88 84 L92 108"/>
    <path d="M38 98 H90" stroke-width="3.5"/>
  </g>
  <!-- chrome back uprights -->
  <g stroke="#cfdcd5" stroke-width="4" stroke-linecap="round">
    <path d="M40 40 V68"/>
    <path d="M88 40 V68"/>
  </g>
  <!-- backrest -->
  <rect x="34" y="18" width="60" height="48" rx="13" fill="#7cc83a"/>
  <rect x="38" y="21" width="52" height="40" rx="10" fill="#a6e65a"/>
  <!-- face -->
  <g fill="#14402f">
    <circle cx="55" cy="38" r="3.6"/>
    <circle cx="73" cy="38" r="3.6"/>
  </g>
  <path d="M55 48 Q64 56 73 48" fill="none" stroke="#14402f" stroke-width="3.2" stroke-linecap="round"/>
  <!-- seat -->
  <rect x="26" y="66" width="76" height="20" rx="9" fill="#6ab82f"/>
  <rect x="26" y="66" width="76" height="12" rx="9" fill="#8fd847"/>
</svg>
